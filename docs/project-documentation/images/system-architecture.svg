<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="455" viewBox="0 0 1210 455" role="img" aria-label="Hotlog համակարգի ընդհանուր ճարտարապետությունը"><title>Hotlog համակարգի ընդհանուր ճարտարապետությունը</title><desc>Վեբ միջերեսն ու արտաքին հավելվածները միավորվում են ընդհանուր տվյալների պայմանագրով։</desc><defs><pattern id="hatch-plum" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><path d="M 1 0 V 8" stroke="#2C112B" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="1 2" stroke-linecap="round"/></pattern><pattern id="hatch-orange" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFAF7"/><path d="M 1 0 V 8" stroke="#FF6C40" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="1 2" stroke-linecap="round"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#C36240" stroke-width="1.7"/></marker></defs><rect width="1210" height="455" fill="#FFFFFF"/><g id="diagram-content" transform="translate(0,-120)"><rect x="40" y="165" width="330" height="135" rx="2" fill="url(#hatch-orange)" stroke="#FF6C40" stroke-width="2"/><text x="205" y="207" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="22" fill="#2C112B" font-weight="600" text-anchor="middle">User Interface</text><text x="205" y="242" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">React · TypeScript</text><text x="205" y="269" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Օգտատիրոջ ինտերֆեյս</text><rect x="440" y="165" width="330" height="135" rx="2" fill="url(#hatch-orange)" stroke="#FF6C40" stroke-width="2"/><text x="605" y="207" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="22" fill="#2C112B" font-wei