<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="435" viewBox="0 0 1180 435" role="img" aria-label="Կայուն պայմանագիր և խմբագրվող ներկայացում"><title>Կայուն պայմանագիր և խմբագրվող ներկայացում</title><desc>Սխեմայի կամ դաշտի անվան փոփոխությունը չի փոխում իրադարձության տեխնիկական բանալին։</desc><defs><pattern id="hatch-plum" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><path d="M 1 0 V 8" stroke="#2C112B" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="1 2" stroke-linecap="round"/></pattern><pattern id="hatch-orange" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFAF7"/><path d="M 1 0 V 8" stroke="#FF6C40" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="1 2" stroke-linecap="round"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#C36240" stroke-width="1.7"/></marker></defs><rect width="1180" height="435" fill="#FFFFFF"/><g id="diagram-content" transform="translate(0,-120)"><rect x="40" y="160" width="510" height="135" rx="2" fill="url(#hatch-orange)" stroke="#FF6C40" stroke-width="2"/><text x="295" y="202" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="22" fill="#2C112B" font-weight="600" text-anchor="middle">Սխեմայի նույնականացում</text><text x="295" y="237" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">schemas.key</text><text x="295" y="264" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">API-ն պահպանում է կայունությունը</text><rect x="630" y="160" width="510" height="135" rx="2" fill="url(#hatch-orange)" stroke="#FF6C40" stroke-width="2"/><text x="885" y="202" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="22" fill="#2C112B" font-weight="600" text-anchor="middle">Դաշտի նույնականացում</text><text x="885" y="237" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">fields.key + fields.type</text><text x="885" y="264" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">API-ն չի թույլատրում փոխել</text><rect x="40" y="380" width="510" height="135" rx="2" fill="url(#hatch-orange)" stroke="#FF6C40" stroke-width="2"/><text x="295" y="422" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="22" fill="#2C112B" font-weight="600" text-anchor="middle">Խմբագրվող նկարագրություն</text><text x="295" y="457" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">display_name · metadata</text><text x="295" y="484" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">required · կիրառվող կանոններ</text><rect x="630" y="380" width="510" height="135" rx="2" fill="url(#hatch-orange)" stroke="#FF6C40" stroke-width="2"/><text x="885" y="422" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="22" fill="#2C112B" font-weight="600" text-anchor="middle">Արխիվացում և վերականգնում</text><text x="885" y="457" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">active ↔ archived</text><text x="885" y="484" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Պատմական գրառումները պահվում են</text><polyline points="295,295 295,380" fill="none" stroke="#C36240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="885,295 885,380" fill="none" stroke="#C36240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/></g></svg>
