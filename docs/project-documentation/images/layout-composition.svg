<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="445" viewBox="0 0 1200 445" role="img" aria-label="Դասավորության և բաղադրիչների կառուցվածքը"><title>Դասավորության և բաղադրիչների կառուցվածքը</title><desc>Կարգավորումը պահպանում է տեղադրությունը, պատկերավորման տեսակը և դաշտերի կապակցումը։</desc><defs><pattern id="hatch-plum" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><path d="M 1 0 V 8" stroke="#2C112B" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="1 2" stroke-linecap="round"/></pattern><pattern id="hatch-orange" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFAF7"/><path d="M 1 0 V 8" stroke="#FF6C40" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="1 2" stroke-linecap="round"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#C36240" stroke-width="1.7"/></marker></defs><rect width="1200" height="445" fill="#FFFFFF"/><g id="diagram-content" transform="translate(0,-120)"><rect x="40" y="160" width="720" height="365" rx="2" fill="url(#hatch-plum)" stroke="#94798B" stroke-width="2"/><text x="65" y="198" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="24" fill="#2C112B" font-weight="600">layouts</text><rect x="65" y="220" width="670" height="90" rx="2" fill="url(#hatch-orange)" stroke="#FF6C40" stroke-width="2"/><text x="85" y="252" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#2C112B">components · span = full</text><text x="85" y="285" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#705C64">visualization · index · inputs_ids</text><rect x="65" y="330" width="325" height="150" rx="2" fill="url(#hatch-orange)" stroke="#FF6C40" stroke-width="2"/><text x="85" y="365" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#2C112B">span = half</text><text x="85" y="400" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#2C112B">schema_id</text><text x="85" y="433" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#705C64">bindings → fieldKey</text><rect x="410" y="330" width="325" height="150" rx="2" fill="url(#hatch-orange)" stroke="#FF6C40" stroke-width="2"/><text x="430" y="365" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#2C112B">span = half</text><text x="430" y="400" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#2C112B">visualization</text><text x="430" y="433" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="17" fill="#705C64">index → հերթականություն</text><rect x="825" y="160" width="335" height="135" rx="2" fill="url(#hatch-orange)" stroke="#FF6C40" stroke-width="2"/><text x="992.5" y="202" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="22" fill="#2C112B" font-weight="600" text-anchor="middle">Տեղային խմբագրում</text><text x="992.5" y="237" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Ավելացնել · փոխել · ջնջել</text><text x="992.5" y="264" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Save / Cancel</text><rect x="825" y="390" width="335" height="135" rx="2" fill="url(#hatch-orange)" stroke="#FF6C40" stroke-width="2"/><text x="992.5" y="432" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="22" fill="#2C112B" font-weight="600" text-anchor="middle">Ատոմային գրառում</text><text x="992.5" y="467" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">batch_layout_components</text><text x="992.5" y="494" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Մեկ տրանզակցիա</text><polyline po