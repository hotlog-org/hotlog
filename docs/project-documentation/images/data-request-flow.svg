<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="415" viewBox="0 0 1160 415" role="img" aria-label="Վեբ հարցման և պատասխանի ճանապարհը"><title>Վեբ հարցման և պատասխանի ճանապարհը</title><desc>Վեբ հարցման նույնականացումը պահպանում է օգտատիրոջ Supabase նստաշրջանը։</desc><defs><pattern id="hatch-plum" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><path d="M 1 0 V 8" stroke="#2C112B" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="1 2" stroke-linecap="round"/></pattern><pattern id="hatch-orange" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFAF7"/><path d="M 1 0 V 8" stroke="#FF6C40" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="1 2" stroke-linecap="round"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#C36240" stroke-width="1.7"/></marker></defs><rect width="1160" height="415" fill="#FFFFFF"/><g id="diagram-content" transform="translate(0,-120)"><polyline points="370,225 415,225" fill="none" stroke="#C36240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="745,225 790,225" fill="none" stroke="#C36240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="955,290 955,360" fill="none" stroke="#C36240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="790,430 745,430" fill="none" stroke="#C36240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="415,430 370,430" fill="none" stroke="#C36240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="155" width="330" height="135" rx="2" fill="url(#hatch-orange)" stroke="#FF6C40" stroke-width="2"/><text x="205" y="197" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="22" fill="#2C112B" font-weight="600" text-anchor="middle">1. Գործողություն</text><text x="205" y="232" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Էջ · ձև · կոճակ</text><text x="205" y="259" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Hook / service</text><rect x="415" y="155" width="330" height="135" rx="2" fill="url(#hatch-orange)" stroke="#FF6C40" stroke-width="2"/><text x="580" y="197" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="22" fill="#2C112B" font-weight="600" text-anchor="middle">2. Տիպավորված HTTP</text><text x="580" y="232" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">shared/api · ky</text><text x="580" y="259" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Հարցման տվյալներ</text><rect x="790" y="155" width="330" height="135" rx="2" fill="url(#hatch-orange)" stroke="#FF6C40" stroke-width="2"/><text x="955" y="197" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="22" fill="#2C112B" font-weight="600" text-anchor="middle">3. Route handler</text><text x="955" y="232" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Մուտքի տվյալների ստուգում</text><text x="955" y="259" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Supabase server client</text><rect x="790" y="360" width="330" height="135" rx="2" fill="url(#hatch-orange)" stroke="#FF6C40" stroke-width="2"/><text x="955" y="402" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="22" fill="#2C112B" font-weight="600" text-anchor="middle">4. Տվյալների սահման</text><text x="955" y="437" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">RLS · SQL RPC</text><text x="955" y="464" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Constraint · trigger</text><rect x="415" y="360" width="330" height="135" rx="2" fill="url(#hatch-orange)" stroke="#FF6C40" stroke-width="2"/><text x="580" y="402" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="22" fill="#2C112B" font-weight="600" text-anchor="middle">5. JSON պատասխան</text><text x="580" y="437" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Տվյալներ կամ սխալ</text><text x="580" y="464" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">snake_case → camelCase</text><rect x="40" y="360" width="330" height="135" rx="2" fill="url(#hatch-orange)" stroke="#FF6C40" stroke-width="2"/><text x="205" y="402" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="22" fill="#2C112B" font-weight="600" text-anchor="middle">6. Միջերեսի թարմացում</text><text x="205" y="437" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Cache-ի թարմացում</text><text x="205" y="464" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Սխալի դեպքում՝ rollback</text></g></svg>
