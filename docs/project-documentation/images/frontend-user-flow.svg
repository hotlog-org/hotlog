<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="415" viewBox="0 0 1160 415" role="img" aria-label="Օգտատիրոջ հիմնական աշխատանքային սցենարը"><title>Օգտատիրոջ հիմնական աշխատանքային սցենարը</title><desc>Նախագծի ընտրությունը սահմանում է էջերի և գործողությունների համատեքստը։</desc><defs><pattern id="hatch-plum" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><path d="M 1 0 V 8" stroke="#2C112B" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="1 2" stroke-linecap="round"/></pattern><pattern id="hatch-orange" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFAF7"/><path d="M 1 0 V 8" stroke="#FF6C40" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="1 2" stroke-linecap="round"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#C36240" stroke-width="1.7"/></marker></defs><rect width="1160" height="415" fill="#FFFFFF"/><g id="diagram-content" transform="translate(0,-120)"><polyline points="370,225 415,225" fill="none" stroke="#C36240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="745,225 790,225" fill="none" stroke="#C36240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="955,290 955,360" fill="none" stroke="#C36240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="790,430 745,430" fill="none" stroke="#C36240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="415,430 370,430" fill="none" stroke="#C36240" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="155" width="330" height="135" rx="2" fill="url(#hatch-orange)" stroke="#FF6C40" stroke-width="2"/><text x="205" y="197" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="22" fill="#2C112B" font-weight="600" text-anchor="middle">1. Մուտք և նախագիծ</text><text x="205" y="232" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Նույնականացում</text><text x="205" y="259" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Ընտրություն կամ ստեղծում</text><rect x="415" y="155" width="330" height="135" rx="2" fill="url(#hatch-orange)" stroke="#FF6C40" stroke-width="2"/><text x="580" y="197" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="22" fill="#2C112B" font-weight="600" text-anchor="middle">2. Սխեմա և դաշտեր</text><text x="580" y="232" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Կառուցվածքի սահմանում</text><text x="580" y="259" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Ձևի ստուգում</text><rect x="790" y="155" width="330" height="135" rx="2" fill="url(#hatch-orange)" stroke="#FF6C40" stroke-width="2"/><text x="955" y="197" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="22" fill="#2C112B" font-weight="600" text-anchor="middle">3. Ինտեգրում</text><text x="955" y="232" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">API key · SDK տիպեր</text><text x="955" y="259" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Բանալու միանվագ ցուցադրում</text><rect x="790" y="360" width="330" height="135" rx="2" fill="url(#hatch-orange)" stroke="#FF6C40" stroke-width="2"/><text x="955" y="402" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="22" fill="#2C112B" font-weight="600" text-anchor="middle">4. Իրադարձություններ</text><text x="955" y="437" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Սխեմայի ֆիլտր</text><text x="955" y="464" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Էջավորում · գրառման տվյալներ</text><rect x="415" y="360" width="330" height="135" rx="2" fill="url(#hatch-orange)" stroke="#FF6C40" stroke-width="2"/><text x="580" y="402" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="22" fill="#2C112B" font-weight="600" text-anchor="middle">5. Վահանակի խմբագրում</text><text x="580" y="437" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Բաղադրիչներ և կապակցումներ</text><text x="580" y="464" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Չափ · դիրք · Save / Cancel</text><rect x="40" y="360" width="330" height="135" rx="2" fill="url(#hatch-orange)" stroke="#FF6C40" stroke-width="2"/><text x="205" y="402" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="22" fill="#2C112B" font-weight="600" text-anchor="middle">6. Թիմ և կարգավորումներ</text><text x="205" y="437" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Դերեր · հրավերներ</text><text x="205" y="464" font-family="Noto Sans Armenian,Arial,sans-serif" font-size="18" fill="#705C64" text-anchor="middle">Լեզու · թեմա · հաշիվ</text></g></svg>
